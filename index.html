<body>
  <div class="container">
    <h2>Patient & Coupons Lookup</h2>
    <input id="mobile" placeholder="Enter mobile number" />
    <button onclick="fetchPatient()">Fetch Patient</button>
    <button onclick="checkCoupons()">Check Coupons</button>
    <div id="output"></div>
  </div>

  <script>
    const WORKER_URL = "https://long-leaf-8942.ashishrohra-ttb.workers.dev"

    async function fetchPatient() {
      const mobile = document.getElementById("mobile").value
      const out = document.getElementById("output")
      out.innerHTML = "Loading patient info..."
      const res = await fetch(`${WORKER_URL}/api/patient?mobile=${mobile}`)
      const data = await res.json()

      if (data.error) { out.innerHTML = data.error; return }

      out.innerHTML = `
        <div class="box">
          <h3>${data.first_name}</h3>
          <div class="muted">Mobile: ${data.mobile_number}</div>
          <div class="muted">DOB: ${data.dob}</div>
          <span class="muted">${data.gender}</span>
        </div>
      `

      if (data.customer_relations?.length) {
        out.innerHTML += "<h3>Members</h3>"
        data.customer_relations.forEach(m => {
          out.innerHTML += `
            <div class="box">
              <strong>${m.name}</strong>
              <div class="muted">${m.relationship} · ${m.gender} · Age ${m.age}</div>
            </div>
          `
        })
      }

      if (data.customer_addresses?.length) {
        out.innerHTML += "<h3>Saved Addresses</h3>"
        data.customer_addresses.forEach(a => {
          out.innerHTML += `
            <div class="box">
              <strong>${a.label}</strong>
              <div class="muted">${a.autofill_location}</div>
            </div>
          `
        })
      }
    }

    async function checkCoupons() {
      const mobile = document.getElementById("mobile").value
      const out = document.getElementById("output")
      out.innerHTML = "Checking eligible coupons..."

      const res = await fetch(`${WORKER_URL}/api/coupons`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userNumber: mobile })
      })
      const data = await res.json()

      if (!data.eligibleCoupons || data.eligibleCoupons.length === 0) {
        out.innerHTML = "No coupons available"
        return
      }

      out.innerHTML = "<h3>Eligible Coupons</h3>"
      data.eligibleCoupons.forEach(c => {
        out.innerHTML += `
          <div class="box">
            <strong>${c.couponCode}</strong>
            <div class="muted">${c.shortDescription}</div>
          </div>
        `
      })
    }
  </script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f7f4" />

  <title>OH Coupon Checker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f8f7f4;
      --ink: #22231f;
      --muted: #77776f;
      --accent: #f16a43;
      --line: #e9e6df;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse at 15% 10%, #fffaf4 0%, transparent 45%),
        radial-gradient(ellipse at 90% 90%, #f8e9e1 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 760px;
      min-height: 490px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 82px 32px 28px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 50% 0%, #ffffff 0%, transparent 65%),
        rgba(255, 255, 255, 0.35);
      box-shadow: 0 24px 80px rgba(40, 35, 25, 0.045);
      animation: enter 700ms ease-out both;
    }

    .topline {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a3a39a;
    }

    .symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin-bottom: 30px;
      border: 1px solid #f0d8ce;
      border-radius: 24px;
      background: #fff0e9;
      color: var(--accent);
      transform: rotate(-5deg);
    }

    .symbol svg {
      width: 34px;
      height: 34px;
      transform: rotate(5deg);
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(48px, 9vw, 82px);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -5px;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      letter-spacing: -3px;
    }

    .message {
      max-width: 360px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .bottom {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 62px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: right;
    }

    .signature {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .signature strong {
      color: var(--ink);
      font-weight: 800;
    }

    .heart {
      display: inline-block;
      color: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .decoration {
      position: absolute;
      z-index: -1;
      color: #e8e1d7;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
    }

    .decoration.one {
      top: 29%;
      left: 9%;
      transform: rotate(-15deg);
    }

    .decoration.two {
      right: 9%;
      bottom: 31%;
      color: #f0c8b9;
      transform: rotate(15deg);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @media (max-width: 520px) {
      .page {
        min-height: 460px;
        padding: 78px 22px 24px;
        border-radius: 22px;
      }

      .topline {
        top: 20px;
        left: 20px;
        right: 20px;
      }

      .brand {
        font-size: 10px;
        letter-spacing: 1px;
      }

      .status {
        font-size: 10px;
      }

      h1 {
        letter-spacing: -3px;
      }

      h1 span {
        letter-spacing: -2px;
      }

      .message {
        font-size: 13px;
      }

      .bottom {
        margin-top: 48px;
      }

      .signature {
        font-size: 11px;
      }

      .decoration.one {
        left: 5%;
      }

      .decoration.two {
        right: 5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="topline">
      <span class="brand">OH Coupon Checker</span>

      <span class="status">

      </span>
    </header>

    <span class="decoration one" aria-hidden="true">✳</span>

    <div class="symbol" aria-hidden="true">

           stroke="currentColor" stroke-width="1.6"

        <path d="M18.4 15A7 7 0 0 1 6.5 18L4 12" />
      </svg>
    </div>

    <p class="eyebrow">Mission accomplished</p>

    <h1>
      That's a
      <span>wrap.</span>
    </h1>

    <p class="message">
      This page has served its purpose.
      Thanks for stopping by!
    </p>

    <footer class="bottom">
      <span class="signature">
        Made with <span class="heart">♥</span> by
        <strong>Ashish</strong>
      </span>
    </footer>

  </main>
</body>
</html>
